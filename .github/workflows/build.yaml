name: build

# The unit tests and the library of each platform, with the double precision Godot fetched from the
# release godot-<version>-double (ci/fetch-godot.sh), which the godot-engine workflow builds once
# per engine version. The tests and the Windows and Android libraries are built on the runner; the
# Linux release library in ci/docker/linux-sdk, for an old glibc. Exporting and releasing the game
# is the game's repository's.
on:
  pull_request:
  workflow_dispatch:

jobs:
  godot-engine:
    uses: ./.github/workflows/godot-engine.yml
    permissions:
      contents: write

  run-tests:
    needs: godot-engine
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch the double precision Godot
        run: |
          ci/fetch-godot.sh godot.linuxbsd.editor.double.x86_64
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # the addons the demo links in from the checkout (see .gitignore)
      - name: Link the addons
        run: |
          ln -s ../../vendor/gut/addons/gut demo/addons/gut
          ln -s ../../addons/libreloaded demo/addons/libreloaded

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: tests

      # the tests need no old glibc, so the library is built on the runner itself; the empty
      # overrides leave out the clang-tidy database compile-debug prepares for the IDE
      - name: Build the library
        run: make compile-debug CLANG_TIDY_COMPILE_COMMANDS_FILE= CLANG_TIDY_BINDINGS_FILE=

      - name: Import the project
        run: godot-double --headless --path demo --import

      # GUT skips a test script that does not parse with only a warning and does not count it, so
      # the run fails on the engine's own message for it; pipefail keeps GUT's own exit code, which
      # tee would otherwise replace with its own success
      - name: Run the tests
        run: |
          set -o pipefail
          godot-double --headless --path demo -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests/ -gexit -gjunit_xml_file=res://test_results.xml 2>&1 | tee gut.log
          ! grep "Failed to load script" gut.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gut-test-results
          path: demo/test_results.xml

  build:
    needs: godot-engine
    # packages: the Linux SDK image, published to ghcr.io when its tag is not there yet
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            make: compile-release-linux
          - platform: windows
            make: compile-windows-release
          - platform: android
            make: compile-android-release
    runs-on: ubuntu-24.04
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # the directory ccache-action keeps; the Makefile mounts it into the Linux SDK container
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # CMake dumps the double precision API from it (CMakeLists.txt) - on the runner also for the
      # Linux library, whose SDK container has no Godot
      - name: Fetch the double precision Godot
        run: |
          ci/fetch-godot.sh godot.linuxbsd.editor.double.x86_64
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install MinGW
        if: matrix.platform == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.platform }}

      # The Linux release is built in an image tagged by its Dockerfile; a changed Dockerfile is a tag
      # not on ghcr.io yet, so CI builds it once and publishes it, and later runs - here, in a plugin's
      # or a game's CI - pull it. A pull request from a fork has a read-only token: it builds it for itself
      - name: Publish the Linux SDK image
        if: matrix.platform == 'linux' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          make linux-sdk-image-push

      - name: Build the ${{ matrix.platform }} library
        run: make ${{ matrix.make }}

      - uses: actions/upload-artifact@v7
        with:
          name: lib-${{ matrix.platform }}-template_release
          path: demo/bin/libreloaded/${{ matrix.platform }}
          if-no-files-found: error
